name: OmniWorld CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.9'
  NODE_VERSION: '18'

jobs:
  # Backend API Tests
  backend-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        cd Backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-asyncio
    
    - name: Run backend tests
      run: |
        cd Backend
        pytest tests/ -v --cov=api --cov-report=xml --cov-report=html
      continue-on-error: true
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./Backend/coverage.xml
        flags: backend
        name: backend-coverage
      continue-on-error: true
    
    - name: Lint with pylint
      run: |
        cd Backend
        pip install pylint
        pylint api/ --exit-zero
      continue-on-error: true

  # Smart Contract Tests
  contract-tests:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js ${{ env.NODE_VERSION }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: Assets/Contracts/Source/package-lock.json
    
    - name: Install dependencies
      run: |
        cd Assets/Contracts/Source
        npm ci
    
    - name: Compile contracts
      run: |
        cd Assets/Contracts/Source
        npx hardhat compile
    
    - name: Run contract tests
      run: |
        cd Assets/Contracts/Source
        npx hardhat test
      continue-on-error: true
    
    - name: Run contract coverage
      run: |
        cd Assets/Contracts/Source
        npx hardhat coverage
      continue-on-error: true
    
    - name: Lint contracts
      run: |
        cd Assets/Contracts/Source
        npx solhint 'contracts/**/*.sol'
      continue-on-error: true

  # Code Quality Checks
  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0  # Shallow clones should be disabled for analysis
    
    - name: Run code quality checks
      run: |
        echo "Running code quality analysis..."
        find Assets/Scripts -name "*.cs" | wc -l
        find Backend -name "*.py" | wc -l
    
    - name: Check for TODOs
      run: |
        echo "Checking for TODO comments..."
        grep -r "TODO" Assets/Scripts/ Backend/ || echo "No TODOs found"
      continue-on-error: true

  # Documentation Build
  docs-build:
    name: Build Documentation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Validate markdown files
      run: |
        echo "Validating markdown documentation..."
        find Docs -name "*.md" -exec echo "Checking {}" \;
    
    - name: Check links in documentation
      run: |
        echo "Checking documentation links..."
        # Add link checker here if needed
      continue-on-error: true

  # Build Summary
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, contract-tests, code-quality, docs-build]
    if: always()
    
    steps:
    - name: Generate build summary
      run: |
        echo "## OmniWorld CI/CD Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build Time:** $(date)" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
        echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Job Status" >> $GITHUB_STEP_SUMMARY
        echo "- Backend Tests: ${{ needs.backend-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Contract Tests: ${{ needs.contract-tests.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Code Quality: ${{ needs.code-quality.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- Documentation: ${{ needs.docs-build.result }}" >> $GITHUB_STEP_SUMMARY

  # Deployment (only on main branch)
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [backend-tests, contract-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Deploy backend to staging
      run: |
        echo "Deploying backend to staging environment..."
        # Add deployment logic here
      continue-on-error: true
    
    - name: Notify deployment status
      run: |
        echo "Deployment completed successfully"
